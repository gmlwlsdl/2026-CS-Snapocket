{% extends "base.html" %}
{% block content %}

<section class="panel">
  <div class="panel-head">
    <h2>Container Logs</h2>
    <span class="muted mono">{{ container }}</span>
  </div>

  <div class="inline-form log-controls">
    <label for="container-select">Container</label>
    <select id="container-select">
      {% for c in containers %}
      <option value="{{ c }}" {% if c == container %}selected{% endif %}>{{ c }}</option>
      {% endfor %}
    </select>

    <label for="tail-select">Tail</label>
    <select id="tail-select">
      <option value="100" {% if tail == 100 %}selected{% endif %}>100</option>
      <option value="200" {% if tail == 200 %}selected{% endif %}>200</option>
      <option value="500" {% if tail == 500 %}selected{% endif %}>500</option>
      <option value="1000" {% if tail == 1000 %}selected{% endif %}>1000</option>
      <option value="2000" {% if tail == 2000 %}selected{% endif %}>2000</option>
    </select>

    <button id="btn-reconnect" type="button">Reconnect</button>
    <button id="btn-clear" type="button" class="ghost">Clear</button>
    <span id="status-badge" class="badge warn">connecting</span>
    <span id="line-count" class="mono muted"></span>
  </div>

  <div class="terminal" id="log-list"></div>
</section>

<script>
(function () {
  var list = document.getElementById("log-list");
  var badge = document.getElementById("status-badge");
  var count = document.getElementById("line-count");
  var containerSelect = document.getElementById("container-select");
  var tailSelect = document.getElementById("tail-select");
  var btnReconnect = document.getElementById("btn-reconnect");
  var btnClear = document.getElementById("btn-clear");
  var es = null;
  var lines = 0;

  function setStatus(kind, text) {
    badge.className = "badge " + kind;
    badge.textContent = text;
  }

  function classify(line) {
    var t = String(line || "").toLowerCase();
    if (t.indexOf("error") >= 0 || t.indexOf("exception") >= 0 || t.indexOf("traceback") >= 0) return "err";
    if (t.indexOf("warn") >= 0) return "warn";
    return "ok";
  }

  function addLine(text) {
    var div = document.createElement("div");
    div.className = "term-line term-" + classify(text);
    div.textContent = text;
    list.appendChild(div);
    lines += 1;
    count.textContent = lines + " lines";
    while (list.childElementCount > 2000) {
      list.removeChild(list.firstChild);
    }
    list.scrollTop = list.scrollHeight;
  }

  function clearTerminal() {
    list.innerHTML = "";
    lines = 0;
    count.textContent = "";
  }

  function connect() {
    if (es) {
      es.close();
      es = null;
    }
    setStatus("warn", "connecting");
    var query = new URLSearchParams({
      container: containerSelect.value,
      tail: tailSelect.value
    }).toString();
    es = new EventSource("/ops/logs/stream?" + query);

    es.addEventListener("connected", function () {
      setStatus("ok", "live");
    });
    es.addEventListener("warning", function (evt) {
      setStatus("warn", "warning");
      if (evt && evt.data) addLine("[warn] " + evt.data);
    });
    es.addEventListener("error", function (evt) {
      setStatus("err", "error");
      if (evt && evt.data) addLine("[error] " + evt.data);
    });
    es.addEventListener("closed", function () {
      setStatus("warn", "closed");
      if (es) es.close();
    });
    es.onmessage = function (evt) {
      if (evt && evt.data) addLine(evt.data);
    };
    es.onerror = function () {
      setStatus("warn", "reconnecting");
    };
  }

  btnReconnect.addEventListener("click", function () {
    clearTerminal();
    connect();
  });
  btnClear.addEventListener("click", clearTerminal);
  containerSelect.addEventListener("change", function () {
    clearTerminal();
    connect();
  });
  tailSelect.addEventListener("change", function () {
    clearTerminal();
    connect();
  });

  connect();
})();
</script>

{% endblock %}
